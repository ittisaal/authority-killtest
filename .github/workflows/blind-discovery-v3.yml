name: Blind repository discovery v3

on:
  pull_request:

permissions:
  contents: read

jobs:
  blind-v3:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify frozen blind-v3 files
        run: |
          python - <<'PY'
          import json, subprocess
          freeze = json.load(open('benchmark/discovery/FREEZE_V3.json'))
          for path, expected in freeze['files'].items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if actual != expected:
                  raise SystemExit(f'freeze mismatch: {path}: {actual} != {expected}')
          print(f"frozen files verified: {len(freeze['files'])}")
          PY

      - name: Reject scoring-field leakage
        run: |
          python - <<'PY'
          import json
          data = json.load(open('benchmark/discovery/blind-v3-input.json'))
          bad = {'target_property', 'expected_label', 'label', 'strict_label'}
          for case in data['cases']:
              leak = bad & set(case)
              if leak:
                  raise SystemExit(f"{case['id']} leaks {sorted(leak)}")
          print(f"blind-v3 inputs verified: {len(data['cases'])} cases")
          PY

      - name: Run blind-v3 unit tests
        run: python benchmark/discovery/test_discover_repository_v3.py

      - name: Run frozen target-blind discovery v3
        run: |
          python benchmark/discovery/run_blind_v3.py \
            benchmark/discovery/blind-v3-input.json \
            --output benchmark/discovery/blind-v3-raw-results.json

      - name: Show raw summary
        run: |
          python - <<'PY'
          import json
          p='benchmark/discovery/blind-v3-raw-results.json'
          data=json.load(open(p))
          print(json.dumps(data['summary'], indent=2, sort_keys=True))
          for case in data['cases']:
              print(case['id'], case['repository'], 'status=', case['status'],
                    'candidates=', case['candidate_count'],
                    'labels=', [x['label'] for x in case['candidates']])
          PY

      - name: Upload raw blind-v3 results
        uses: actions/upload-artifact@v4
        with:
          name: blind-discovery-v3-raw-results
          path: benchmark/discovery/blind-v3-raw-results.json
