name: Blind repository discovery v5

on:
  pull_request:
    paths:
      - 'benchmark/discovery/FREEZE_V5.json'
      - 'benchmark/discovery/blind-v5-input.json'
      - 'benchmark/discovery/blind-v5-gold-commitment.json'
      - 'benchmark/discovery/run_blind_v5.py'
      - '.github/workflows/blind-discovery-v5.yml'

permissions:
  contents: read

jobs:
  blind-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify frozen blind-v5 files
        run: |
          python - <<'PY'
          import json, subprocess
          freeze = json.load(open('benchmark/discovery/FREEZE_V5.json'))
          for path, expected in freeze['files'].items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if actual != expected:
                  raise SystemExit(f'freeze mismatch: {path}: {actual} != {expected}')
          print(f"frozen files verified: {len(freeze['files'])}")
          PY

      - name: Reject scoring-field leakage and require distinct owners
        run: |
          python - <<'PY'
          import json
          data = json.load(open('benchmark/discovery/blind-v5-input.json'))
          bad = {'target_property', 'expected_label', 'label', 'strict_label', 'reason'}
          for case in data['cases']:
              leak = bad & set(case)
              if leak:
                  raise SystemExit(f"{case['id']} leaks {sorted(leak)}")
          owners={c['repository'].split('/',1)[0].lower() for c in data['cases']}
          if len(owners) != len(data['cases']):
              raise SystemExit('blind-v5 requires distinct owners for this test set')
          print(f"blind-v5 inputs verified: {len(data['cases'])} cases / {len(owners)} owners")
          PY

      - name: Run frozen V5 unit tests
        run: python benchmark/discovery/test_discover_repository_v5.py

      - name: Run frozen blind discovery V5
        run: |
          python benchmark/discovery/run_blind_v5.py \
            benchmark/discovery/blind-v5-input.json \
            --workers 4 \
            --output benchmark/discovery/blind-v5-raw-results.json

      - name: Show raw summary
        run: |
          python - <<'PY'
          import json
          p='benchmark/discovery/blind-v5-raw-results.json'
          data=json.load(open(p))
          print(json.dumps(data['summary'], indent=2, sort_keys=True))
          for case in data['cases']:
              print(case['id'], case['repository'], 'status=', case['status'],
                    'candidates=', case['candidate_count'],
                    'labels=', [x['label'] for x in case['candidates']],
                    'raw_v4=', [x.get('raw_v4_label') for x in case['candidates']])
          PY

      - name: Upload raw blind-v5 results
        uses: actions/upload-artifact@v4
        with:
          name: blind-discovery-v5-raw-results
          path: benchmark/discovery/blind-v5-raw-results.json
