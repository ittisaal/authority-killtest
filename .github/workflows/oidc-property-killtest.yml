name: OIDC custom-property kill test

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  inspect-oidc-claim:
    runs-on: ubuntu-latest
    steps:
      - name: Request GitHub OIDC token and test GCP authorization
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=authority-killtest")"

          JWT="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$RESPONSE")"
          export JWT

          python3 - <<'PY'
          import base64
          import json
          import os

          token = os.environ["JWT"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print("repository=" + str(claims.get("repository")))
          print("repo_property_security_tier=" + str(claims.get("repo_property_security_tier")))
          PY

          STS_RESPONSE="$(curl --fail --silent --show-error \
            -X POST "https://sts.googleapis.com/v1/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
            --data-urlencode "audience=//iam.googleapis.com/projects/955080194984/locations/global/workloadIdentityPools/authority-killtest/providers/github" \
            --data-urlencode "scope=https://www.googleapis.com/auth/cloud-platform" \
            --data-urlencode "requested_token_type=urn:ietf:params:oauth:token-type:access_token" \
            --data-urlencode "subject_token_type=urn:ietf:params:oauth:token-type:jwt" \
            --data-urlencode "subject_token=${JWT}")"

          ACCESS_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$STS_RESPONSE")"

          HTTP_CODE="$(curl --silent --show-error \
            -o /tmp/project-response.json \
            -w '%{http_code}' \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://cloudresourcemanager.googleapis.com/v3/projects/g-star-raw-take-home-project")"

          echo "gcp_project_get_http_status=${HTTP_CODE}"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "gcp_project_get=AUTHORIZED"
          elif [ "$HTTP_CODE" = "403" ]; then
            echo "gcp_project_get=DENIED"
          else
            echo "gcp_project_get=UNEXPECTED"
            python3 - <<'PY'
          import json
          try:
              with open('/tmp/project-response.json') as f:
                  data = json.load(f)
              err = data.get('error', {})
              print('gcp_error_status=' + str(err.get('status')))
              print('gcp_error_message=' + str(err.get('message'))[:300])
          except Exception as e:
              print('gcp_error_parse=' + str(e))
          PY
          fi

      - name: Inspect JFrog-audience GitHub OIDC claim
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=jfrog-github")"

          JWT="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$RESPONSE")"
          export JWT

          python3 - <<'PY'
          import base64
          import json
          import os

          token = os.environ["JWT"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print("jfrog_oidc_repository=" + str(claims.get("repository")))
          print("jfrog_oidc_repo_property_security_tier=" + str(claims.get("repo_property_security_tier")))
          PY

      - name: Set up JFrog CLI with OIDC
        id: setup-jfrog-cli
        uses: jfrog/setup-jfrog-cli@29fa5190a4123350e81e2a2e8d803b2a27fed15e
        env:
          JF_URL: https://st12357.jfrog.io
        with:
          oidc-provider-name: github-property-test
          oidc-audience: jfrog-github

      - name: Test JFrog repository read authorization
        shell: bash
        env:
          JFROG_OIDC_TOKEN: ${{ steps.setup-jfrog-cli.outputs.oidc-token }}
        run: |
          set -euo pipefail

          HTTP_CODE="$(curl --silent --show-error \
            -o /tmp/jfrog-response.json \
            -w '%{http_code}' \
            -H "Authorization: Bearer ${JFROG_OIDC_TOKEN}" \
            -H "Accept: application/json" \
            "https://st12357.jfrog.io/artifactory/api/repositories/authority-killtest-local")"

          echo "jfrog_repository_get_http_status=${HTTP_CODE}"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "jfrog_repository_get=AUTHORIZED"
          elif [ "$HTTP_CODE" = "403" ]; then
            echo "jfrog_repository_get=DENIED"
          elif [ "$HTTP_CODE" = "401" ]; then
            echo "jfrog_repository_get=AUTHENTICATION_FAILED"
          else
            echo "jfrog_repository_get=UNEXPECTED"
          fi
