name: OIDC custom-property kill test

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  inspect-oidc-claim:
    runs-on: ubuntu-latest
    steps:
      - name: Request and inspect GitHub OIDC claim
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=authority-killtest")"

          JWT="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$RESPONSE")"
          export JWT

          python3 - <<'PY'
          import base64
          import json
          import os

          token = os.environ["JWT"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          # Deliberately print only the two claims needed for this controlled test.
          print("repository=" + str(claims.get("repository")))
          print("repo_property_security_tier=" + str(claims.get("repo_property_security_tier")))
          PY
