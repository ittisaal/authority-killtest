version: 2
threat_actor: repository_actor_with_property_write_authority

scenarios:
  - id: U1-gcp-oidc
    class: unsafe
    status: complete
    mutation: security_tier restricted -> open
    path:
      - repository actor changes custom property
      - GitHub emits repo_property_security_tier in OIDC token
      - GCP WIF maps the claim
      - IAM condition grants roles/browser
      - workload gains project-read privilege
    evidence_target: GCP project GET changes 403 -> 200

  - id: U2-jfrog-oidc
    class: unsafe
    status: complete
    mutation: security_tier restricted -> open
    path:
      - repository actor changes custom property
      - GitHub emits repo_property_security_tier in OIDC token
      - JFrog OIDC dynamic group mapping consumes the claim
      - group permission grants repository read
      - workload gains Artifactory repository-read privilege
    evidence_target: JFrog repository GET changes 403 -> 200

  - id: U3-required-security-gate-bypass
    class: unsafe
    status: repo-side-implemented-needs-org-admin
    property:
      name: security_scan_policy
      type: single_select
      allowed_values: [enforced, bypass]
      values_editable_by: org_and_repo_actors
    consumer: .github/workflows/benchmark-security-gate.yml
    path:
      - repository actor changes security_scan_policy enforced -> bypass
      - required GitHub Actions security-gate reads repository property
      - bypass value causes gate to report success without inspecting the controlled vulnerability fixture
      - branch ruleset accepts the required check
      - a PR blocked in the baseline state becomes mergeable
    manual_prerequisites:
      - create security_scan_policy in ittisaal with values enforced/bypass and allow repository actors to edit
      - set authority-killtest to enforced initially
      - require the status check security-gate on main
    evidence_target: same PR/commit fails under enforced and succeeds under bypass with no code change

  - id: U4-ruleset-selection-bypass
    class: unsafe
    status: designed-needs-org-admin
    property:
      name: branch_protection_profile
      type: single_select
      allowed_values: [protected, excluded]
      values_editable_by: org_and_repo_actors
    path:
      - organization ruleset targets repositories where branch_protection_profile=protected
      - ruleset requires pull request and approving review
      - repository actor changes property protected -> excluded
      - repository no longer matches ruleset
      - actor gains direct-push/merge behavior previously denied
    manual_prerequisites:
      - create branch_protection_profile in ittisaal with values protected/excluded and allow repository actors to edit
      - create organization ruleset conditioned on branch_protection_profile=protected
      - set authority-killtest to protected initially
    evidence_target: ruleset applies before mutation and no longer applies after mutation

  - id: S1-org-only-selector
    class: safe
    status: designed-needs-org-admin
    property:
      name: org_only_security_profile
      type: single_select
      allowed_values: [restricted, open]
      values_editable_by: org_actors
    reason_safe: repository actor cannot perform the metadata mutation required by the path
    evidence_target: second repository actor cannot change the property value

  - id: S2-fixed-guard
    class: safe
    status: repo-side-implemented-needs-org-admin
    mutable_property:
      name: security_scan_policy
      dangerous_value: bypass
      values_editable_by: org_and_repo_actors
    fixed_guard:
      name: security_floor
      value: enforced
      values_editable_by: org_actors
    consumer: .github/workflows/benchmark-security-gate.yml
    reason_safe: security_floor=enforced forces the scan even when the repository actor selects bypass
    evidence_target: fixture remains blocked after repository actor changes security_scan_policy to bypass

  - id: S3-value-domain-block
    class: safe
    status: repo-side-implemented-needs-org-admin
    property:
      name: scan_profile
      type: single_select
      allowed_values: [standard, hardened]
      values_editable_by: org_and_repo_actors
    consumer: .github/workflows/benchmark-security-gate.yml
    downstream_dangerous_value: disabled
    reason_safe: repository actor can mutate the property but cannot select a value that disables the gate
    evidence_target: both allowed values leave the fixture blocked
